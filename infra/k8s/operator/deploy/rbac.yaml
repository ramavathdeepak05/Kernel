apiVersion: v1
kind: ServiceAccount
metadata:
  name: alis-operator
  namespace: alis-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: alis-operator
rules:
  # TenantStack CRD — full CRUD + status patching
  - apiGroups: ["alis.app"]
    resources: ["tenantstacks"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["alis.app"]
    resources: ["tenantstacks/status"]
    verbs: ["get", "update", "patch"]

  # Events — operator emits Kubernetes events for visibility
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]

  # Secrets — read-only (for Vault token, CP token)
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]

  # ConfigMaps — for leader election (kopf)
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "create", "update", "patch"]

  # Leases — for leader election (kopf)
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: alis-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: alis-operator
subjects:
  - kind: ServiceAccount
    name: alis-operator
    namespace: alis-system
