apiVersion: apps/v1
kind: Deployment
metadata:
  name: alis-operator
  namespace: alis-system
  labels:
    app.kubernetes.io/name: alis-operator
    app.kubernetes.io/component: operator
spec:
  # Operator MUST be a singleton (kopf leader election handles HA)
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: alis-operator
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alis-operator
    spec:
      serviceAccountName: alis-operator
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: operator
          image: ghcr.io/alis-antigravity/alis-operator:latest
          imagePullPolicy: IfNotPresent
          command:
            - kopf
            - run
            - /app/src/reconciler.py
            - --verbose
            - --liveness=http://0.0.0.0:8080/healthz
          ports:
            - name: health
              containerPort: 8080
              protocol: TCP
          env:
            - name: CONTROL_PLANE_URL
              value: "http://alis-control-plane:8001"
            - name: CONTROL_PLANE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: alis-operator-secrets
                  key: CONTROL_PLANE_TOKEN
            - name: RECONCILE_INTERVAL_SECONDS
              value: "60"
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
---
apiVersion: v1
kind: Secret
metadata:
  name: alis-operator-secrets
  namespace: alis-system
type: Opaque
stringData:
  CONTROL_PLANE_TOKEN: "changeme"
---
apiVersion: v1
kind: Namespace
metadata:
  name: alis-system
  labels:
    app.kubernetes.io/part-of: alis
