global:
  image:
    repository: ghcr.io/alis-antigravity/alis-ai-service
    tag: "latest"
    pullPolicy: IfNotPresent
  imagePullSecrets: []

replicaCount: 2

port: 8002

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

service:
  type: ClusterIP
  port: 8002

# Redis (for budget tracking)
redis:
  host: redis
  port: 6379
  db: 1

# VPC Ollama (primary inference provider)
ollama:
  url: http://ollama:11434

# Azure OpenAI (managed provider — enterprise plan)
azure:
  endpoint: ""
  apiKey: ""
  deploymentName: ""

# AWS Bedrock
bedrock:
  region: ""
  accessKeyId: ""
  secretAccessKey: ""

# PII masking
pii:
  enabled: true
  useSpacy: false

# Auth
auth:
  serviceToken: ""   # sourced from secret

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 8
  targetCPUUtilizationPercentage: 70

serviceAccount:
  create: true
  name: ""
  annotations: {}

ingress:
  enabled: false     # AI service is internal-only
