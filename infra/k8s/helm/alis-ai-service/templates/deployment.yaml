apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ai.fullname" . }}
  labels:
    {{- include "ai.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "ai.selectorLabels" . | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        {{- include "ai.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "ai.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: ai-service
          image: {{ include "ai.image" . }}
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.port }}
              protocol: TCP
          command:
            - uvicorn
            - ai_service.main:create_app
            - --factory
            - --host=0.0.0.0
            - --port={{ .Values.port }}
            - --workers=4
          env:
            - name: REDIS_URL
              value: "redis://{{ .Values.redis.host }}:{{ .Values.redis.port }}/{{ .Values.redis.db }}"
            - name: OLLAMA_URL
              value: {{ .Values.ollama.url | quote }}
            - name: AI_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "ai.fullname" . }}-secrets
                  key: AI_SERVICE_TOKEN
            - name: PII_MASKING_ENABLED
              value: {{ .Values.pii.enabled | quote }}
            - name: PII_USE_SPACY
              value: {{ .Values.pii.useSpacy | quote }}
            {{- if .Values.azure.endpoint }}
            - name: AZURE_OPENAI_ENDPOINT
              value: {{ .Values.azure.endpoint | quote }}
            - name: AZURE_OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "ai.fullname" . }}-secrets
                  key: AZURE_OPENAI_API_KEY
            - name: AZURE_OPENAI_DEPLOYMENT_NAME
              value: {{ .Values.azure.deploymentName | quote }}
            {{- end }}
            {{- if .Values.bedrock.region }}
            - name: AWS_DEFAULT_REGION
              value: {{ .Values.bedrock.region | quote }}
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "ai.fullname" . }}-secrets
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "ai.fullname" . }}-secrets
                  key: AWS_SECRET_ACCESS_KEY
            {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ai.fullname" . }}
  labels:
    {{- include "ai.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.port }}
      protocol: TCP
      name: http
  selector:
    {{- include "ai.selectorLabels" . | nindent 4 }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ai.fullname" . }}-secrets
  labels:
    {{- include "ai.labels" . | nindent 4 }}
type: Opaque
stringData:
  AI_SERVICE_TOKEN: "changeme"
  {{- if .Values.azure.apiKey }}
  AZURE_OPENAI_API_KEY: {{ .Values.azure.apiKey | quote }}
  {{- end }}
  {{- if .Values.bedrock.accessKeyId }}
  AWS_ACCESS_KEY_ID: {{ .Values.bedrock.accessKeyId | quote }}
  AWS_SECRET_ACCESS_KEY: {{ .Values.bedrock.secretAccessKey | quote }}
  {{- end }}
---
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ai.serviceAccountName" . }}
  labels:
    {{- include "ai.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
---
{{- if .Values.hpa.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "ai.fullname" . }}
  labels:
    {{- include "ai.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "ai.fullname" . }}
  minReplicas: {{ .Values.hpa.minReplicas }}
  maxReplicas: {{ .Values.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.hpa.targetCPUUtilizationPercentage }}
{{- end }}
