apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cp.fullname" . }}
  labels:
    {{- include "cp.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "cp.selectorLabels" . | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        {{- include "cp.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "cp.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: control-plane
          image: {{ include "cp.image" . }}
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.port }}
              protocol: TCP
          command:
            - uvicorn
            - control_plane.main:create_app
            - --factory
            - --host=0.0.0.0
            - --port={{ .Values.port }}
            - --workers=2
          env:
            - name: CP_DB_HOST
              value: {{ .Values.database.host | quote }}
            - name: CP_DB_PORT
              value: {{ .Values.database.port | quote }}
            - name: CP_DB_NAME
              value: {{ .Values.database.name | quote }}
            - name: CP_DB_USER
              value: {{ .Values.database.user | quote }}
            - name: CP_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "cp.fullname" . }}-secrets
                  key: CP_DB_PASSWORD
            - name: CP_PG_ADMIN_HOST
              value: {{ .Values.pgAdmin.host | quote }}
            - name: CP_PG_ADMIN_PORT
              value: {{ .Values.pgAdmin.port | quote }}
            - name: CP_PG_ADMIN_USER
              value: {{ .Values.pgAdmin.user | quote }}
            - name: CP_PG_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "cp.fullname" . }}-secrets
                  key: CP_PG_ADMIN_PASSWORD
            - name: INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "cp.fullname" . }}-secrets
                  key: INTERNAL_TOKEN
            - name: ADMIN_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "cp.fullname" . }}-secrets
                  key: ADMIN_JWT_SECRET
            - name: ALIS_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "cp.fullname" . }}-secrets
                  key: ALIS_MASTER_KEY
            - name: S3_ENDPOINT_URL
              value: {{ .Values.s3.endpoint | quote }}
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "cp.fullname" . }}-secrets
                  key: S3_ACCESS_KEY
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "cp.fullname" . }}-secrets
                  key: S3_SECRET_KEY
            - name: VAULT_ADDR
              value: {{ .Values.vault.addr | quote }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cp.fullname" . }}
  labels:
    {{- include "cp.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.port }}
      protocol: TCP
      name: http
  selector:
    {{- include "cp.selectorLabels" . | nindent 4 }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cp.fullname" . }}-secrets
  labels:
    {{- include "cp.labels" . | nindent 4 }}
type: Opaque
stringData:
  CP_DB_PASSWORD: "changeme"
  CP_PG_ADMIN_PASSWORD: "changeme"
  INTERNAL_TOKEN: "changeme"
  ADMIN_JWT_SECRET: "changeme-32-char-minimum-secret"
  ALIS_MASTER_KEY: "changeme"
  S3_ACCESS_KEY: "minioadmin"
  S3_SECRET_KEY: "minioadmin"
---
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "cp.serviceAccountName" . }}
  labels:
    {{- include "cp.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
