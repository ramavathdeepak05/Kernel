# -------------------------------------------------------------------------
# ALIS Data Plane — Helm values
# -------------------------------------------------------------------------

global:
  # Docker image
  image:
    repository: ghcr.io/alis-antigravity/alis-data-plane
    tag: "latest"
    pullPolicy: IfNotPresent
  imagePullSecrets: []

  # Namespace override (defaults to Release.Namespace)
  namespace: ""

  # Shared labels applied to every resource
  labels: {}

# -------------------------------------------------------------------------
# FastAPI Application Server
# -------------------------------------------------------------------------
app:
  replicaCount: 2

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

  port: 8000

  # Liveness / readiness probes
  livenessProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 10
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
    httpGet:
      path: /ready
      port: http
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3

  # Pod disruption budget
  pdb:
    enabled: true
    minAvailable: 1

  # Horizontal Pod Autoscaler
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80

  # Node affinity / tolerations
  nodeSelector: {}
  tolerations: []
  affinity: {}

  # Extra environment variables (merged with configmap values)
  extraEnv: []

  # Annotations (e.g. for Datadog, Prometheus scraping)
  podAnnotations: {}

# -------------------------------------------------------------------------
# Celery Worker
# -------------------------------------------------------------------------
celeryWorker:
  enabled: true
  replicaCount: 2

  # Command override
  command:
    - celery
    - -A
    - server.worker
    - worker
    - --loglevel=info
    - --concurrency=4

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 20
    targetCPUUtilizationPercentage: 75

  nodeSelector: {}
  tolerations: []
  affinity: {}

# -------------------------------------------------------------------------
# Celery Beat (single replica — leader election)
# -------------------------------------------------------------------------
celeryBeat:
  enabled: true
  replicaCount: 1    # MUST be 1 — beat is a singleton scheduler

  command:
    - celery
    - -A
    - server.worker
    - beat
    - --loglevel=info

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

  nodeSelector: {}
  tolerations: []
  affinity: {}

# -------------------------------------------------------------------------
# Service
# -------------------------------------------------------------------------
service:
  type: ClusterIP
  port: 80
  targetPort: 8000

# -------------------------------------------------------------------------
# Ingress
# -------------------------------------------------------------------------
ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: "*.alis.app"
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: alis-wildcard-tls
      hosts:
        - "*.alis.app"

# -------------------------------------------------------------------------
# Database (connection config — actual DB is external)
# -------------------------------------------------------------------------
database:
  # System DB (single-tenant fallback / shared tables)
  host: postgres
  port: 5432
  name: alis
  user: alis
  # Password sourced from external secret (see externalSecret below)

# -------------------------------------------------------------------------
# Redis
# -------------------------------------------------------------------------
redis:
  host: redis
  port: 6379
  db: 0

# -------------------------------------------------------------------------
# MinIO / S3
# -------------------------------------------------------------------------
s3:
  endpoint: http://minio:9000
  region: us-east-1
  bucket: alis-uploads    # system-level bucket (tenant buckets are auto-created)

# -------------------------------------------------------------------------
# Control Plane
# -------------------------------------------------------------------------
controlPlane:
  url: http://alis-control-plane:8001
  # Token sourced from external secret

# -------------------------------------------------------------------------
# AI Service
# -------------------------------------------------------------------------
aiService:
  url: http://alis-ai-service:8002
  # Token sourced from external secret

# -------------------------------------------------------------------------
# External Secrets (sourced from Vault / AWS Secrets Manager / etc.)
# -------------------------------------------------------------------------
externalSecret:
  enabled: true
  # SecretStore reference (created separately by ops)
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  # Keys to fetch
  keys:
    dbPassword: alis/system/db/password
    redisPassword: alis/system/redis/password
    controlPlaneToken: alis/system/control-plane/internal-token
    aiServiceToken: alis/system/ai-service/token
    s3AccessKey: alis/system/s3/access-key
    s3SecretKey: alis/system/s3/secret-key

# -------------------------------------------------------------------------
# ServiceAccount
# -------------------------------------------------------------------------
serviceAccount:
  create: true
  name: ""
  annotations: {}

# -------------------------------------------------------------------------
# NetworkPolicy
# -------------------------------------------------------------------------
networkPolicy:
  enabled: true
