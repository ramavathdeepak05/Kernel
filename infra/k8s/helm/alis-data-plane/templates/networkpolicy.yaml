{{- if .Values.networkPolicy.enabled }}
# Restrict traffic: app pods accept ingress only from the ingress controller
# and can egress only to postgres, redis, minio, control-plane, ai-service.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "alis.fullname" . }}-app
  namespace: {{ include "alis.namespace" . }}
  labels:
    {{- include "alis.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "alis.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: app
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow from ingress controller (nginx)
    - from:
        - namespaceSelector:
            matchLabels:
              app.kubernetes.io/name: ingress-nginx
      ports:
        - port: {{ .Values.app.port }}
          protocol: TCP
    # Allow from other ALIS pods in the same namespace (health checks, etc.)
    - from:
        - podSelector: {}
      ports:
        - port: {{ .Values.app.port }}
          protocol: TCP
  egress:
    # PostgreSQL
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - port: {{ .Values.database.port }}
          protocol: TCP
    # Redis
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - port: {{ .Values.redis.port }}
          protocol: TCP
    # MinIO / S3 (9000 for API, 443 for real S3)
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - port: 9000
          protocol: TCP
        - port: 443
          protocol: TCP
    # Control Plane
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: alis-control-plane
      ports:
        - port: 8001
          protocol: TCP
    # AI Service
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: alis-ai-service
      ports:
        - port: 8002
          protocol: TCP
    # DNS
    - to:
        - namespaceSelector: {}
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
---
# Worker pods: same egress as app, but no ingress required (workers don't serve HTTP)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "alis.fullname" . }}-worker
  namespace: {{ include "alis.namespace" . }}
  labels:
    {{- include "alis.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "alis.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  policyTypes:
    - Ingress
    - Egress
  ingress: []   # workers accept no inbound connections
  egress:
    # Same egress rules as app pods
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - port: {{ .Values.database.port }}
          protocol: TCP
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - port: {{ .Values.redis.port }}
          protocol: TCP
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - port: 9000
          protocol: TCP
        - port: 443
          protocol: TCP
    - to:
        - namespaceSelector: {}
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
{{- end }}
