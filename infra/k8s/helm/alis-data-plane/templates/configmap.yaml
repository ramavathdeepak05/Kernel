apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "alis.fullname" . }}-config
  namespace: {{ include "alis.namespace" . }}
  labels:
    {{- include "alis.labels" . | nindent 4 }}
data:
  APP_ENV: "production"
  REDIS_URL: "redis://{{ .Values.redis.host }}:{{ .Values.redis.port }}/{{ .Values.redis.db }}"
  CONTROL_PLANE_URL: {{ .Values.controlPlane.url | quote }}
  AI_SERVICE_URL: {{ .Values.aiService.url | quote }}
  S3_ENDPOINT_URL: {{ .Values.s3.endpoint | quote }}
  S3_REGION: {{ .Values.s3.region | quote }}
  S3_BUCKET: {{ .Values.s3.bucket | quote }}
  SAAS_DOMAIN_SUFFIX: "alis.app"
  DB_HOST: {{ .Values.database.host | quote }}
  DB_PORT: {{ .Values.database.port | quote }}
  DB_NAME: {{ .Values.database.name | quote }}
  DB_USER: {{ .Values.database.user | quote }}
