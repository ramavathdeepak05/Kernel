{{- if .Values.externalSecret.enabled }}
# ExternalSecret CRD (requires external-secrets operator installed in cluster).
# Pulls secrets from Vault / AWS Secrets Manager / Azure Key Vault into a
# Kubernetes Secret that pods reference via secretKeyRef.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "alis.fullname" . }}-secrets
  namespace: {{ include "alis.namespace" . }}
  labels:
    {{- include "alis.labels" . | nindent 4 }}
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: {{ .Values.externalSecret.secretStoreRef.name }}
    kind: {{ .Values.externalSecret.secretStoreRef.kind }}
  target:
    name: {{ include "alis.fullname" . }}-secrets
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: {{ .Values.externalSecret.keys.dbPassword }}
        property: url
    - secretKey: CONTROL_PLANE_TOKEN
      remoteRef:
        key: {{ .Values.externalSecret.keys.controlPlaneToken }}
        property: token
    - secretKey: AI_SERVICE_TOKEN
      remoteRef:
        key: {{ .Values.externalSecret.keys.aiServiceToken }}
        property: token
    - secretKey: S3_ACCESS_KEY
      remoteRef:
        key: {{ .Values.externalSecret.keys.s3AccessKey }}
        property: access_key
    - secretKey: S3_SECRET_KEY
      remoteRef:
        key: {{ .Values.externalSecret.keys.s3SecretKey }}
        property: secret_key
{{- else }}
# Fallback: plain Kubernetes Secret (for dev / testing only).
# In production, use ExternalSecret (externalSecret.enabled=true).
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "alis.fullname" . }}-secrets
  namespace: {{ include "alis.namespace" . }}
  labels:
    {{- include "alis.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: "postgresql://{{ .Values.database.user }}:changeme@{{ .Values.database.host }}:{{ .Values.database.port }}/{{ .Values.database.name }}"
  CONTROL_PLANE_TOKEN: "changeme"
  AI_SERVICE_TOKEN: "changeme"
  S3_ACCESS_KEY: "minioadmin"
  S3_SECRET_KEY: "minioadmin"
{{- end }}
