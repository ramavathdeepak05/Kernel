server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # ---------------------------------------------------------------------------
  # Docker container logs
  # Reads JSON log files written by the Docker json-file log driver.
  # Labels each log stream with the container name.
  # ---------------------------------------------------------------------------
  - job_name: docker_containers
    static_configs:
      - targets:
          - localhost
        labels:
          job: docker
          __path__: /var/lib/docker/containers/*/*-json.log

    pipeline_stages:
      # Parse the Docker JSON log envelope
      - json:
          expressions:
            output: log
            stream: stream
            time: time
            attrs: attrs

      # Extract the container name from Docker metadata attrs
      - json:
          expressions:
            tag: attrs.tag
          source: attrs

      # Use the extracted log field as the actual log line
      - output:
          source: output

      # Set the timestamp from the Docker envelope
      - timestamp:
          source: time
          format: RFC3339Nano

      # Label by container name (parsed from the tag "container_name/container_id")
      - regex:
          expression: "^(?P<container_name>[^/]+)"
          source: tag

      - labels:
          container_name:
          stream:

  # ---------------------------------------------------------------------------
  # System logs (host)
  # ---------------------------------------------------------------------------
  - job_name: system
    static_configs:
      - targets:
          - localhost
        labels:
          job: system
          __path__: /var/log/*.log
