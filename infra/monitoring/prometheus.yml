global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    system: alis
    environment: production

# ---------------------------------------------------------------------------
# Alerting rules
# ---------------------------------------------------------------------------
rule_files:
  - /etc/prometheus/rules/*.yml

# ---------------------------------------------------------------------------
# Alertmanager integration
# ---------------------------------------------------------------------------
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]
      timeout: 10s

scrape_configs:
  # Prometheus self-scrape
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # ALIS FastAPI application metrics
  - job_name: alis_app
    scrape_interval: 15s
    metrics_path: /metrics
    static_configs:
      - targets: ["app:8000"]
        labels:
          service: alis_app

  # Celery worker metrics (via celery-exporter sidecar on port 9808)
  - job_name: alis_celery
    scrape_interval: 30s
    metrics_path: /metrics
    static_configs:
      - targets: ["celery_worker:9808"]
        labels:
          service: alis_celery

  # PostgreSQL exporter (add postgres-exporter service to compose to activate)
  - job_name: alis_postgres
    scrape_interval: 30s
    static_configs:
      - targets: ["postgres_exporter:9187"]
        labels:
          service: postgres

  # Redis exporter (add redis-exporter service to compose to activate)
  - job_name: alis_redis
    scrape_interval: 30s
    static_configs:
      - targets: ["redis_exporter:9121"]
        labels:
          service: redis

  # Nginx exporter (add nginx-exporter service to compose to activate)
  - job_name: alis_nginx
    scrape_interval: 30s
    static_configs:
      - targets: ["nginx_exporter:9113"]
        labels:
          service: nginx
