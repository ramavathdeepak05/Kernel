groups:
  # ---------------------------------------------------------------------------
  # HTTP / API Health
  # ---------------------------------------------------------------------------
  - name: alis_http
    interval: 30s
    rules:
      - alert: HighHTTPErrorRate
        expr: |
          sum(rate(alis_http_requests_total{status_code=~"5.."}[5m]))
          /
          sum(rate(alis_http_requests_total[5m])) > 0.05
        for: 2m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "ALIS API error rate above 5%"
          description: "HTTP 5xx rate is {{ $value | humanizePercentage }} over the last 5 minutes."

      - alert: HighHTTPLatencyP95
        expr: |
          histogram_quantile(0.95,
            sum(rate(alis_http_request_duration_seconds_bucket[5m])) by (le, path)
          ) > 0.5
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "ALIS API p95 latency above 500ms"
          description: "Path {{ $labels.path }} p95={{ $value | humanizeDuration }}."

      - alert: AppDown
        expr: up{job="alis_app"} == 0
        for: 1m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "ALIS application is down"
          description: "The alis_app Prometheus scrape target has been unreachable for 1 minute."

      - alert: HighActiveRequests
        expr: alis_active_requests > 500
        for: 3m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "High number of in-flight HTTP requests"
          description: "{{ $value }} active requests — possible overload or stuck connections."

  # ---------------------------------------------------------------------------
  # Domain Events
  # ---------------------------------------------------------------------------
  - name: alis_domain_events
    interval: 60s
    rules:
      - alert: DomainEventProcessingFailures
        expr: |
          sum(rate(alis_domain_events_processed_total{status="error"}[10m])) > 0.1
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Domain event processing failures detected"
          description: "Event type {{ $labels.event_type }}: {{ $value | humanize }} failures/sec."

      - alert: DomainEventBacklog
        expr: |
          sum(rate(alis_domain_events_published_total[5m]))
          -
          sum(rate(alis_domain_events_processed_total{status="ok"}[5m])) > 10
        for: 10m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Domain event processing backlog growing"
          description: "Events are being published faster than processed — backlog ~{{ $value | humanize }}/sec."

  # ---------------------------------------------------------------------------
  # Celery Workers
  # ---------------------------------------------------------------------------
  - name: alis_celery
    interval: 60s
    rules:
      - alert: CeleryWorkerDown
        expr: up{job="alis_celery"} == 0
        for: 2m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Celery worker metrics unavailable"
          description: "Cannot scrape celery_worker — worker may be down."

      - alert: CeleryTaskSlowP95
        expr: |
          histogram_quantile(0.95,
            sum(rate(alis_celery_task_duration_seconds_bucket[10m])) by (le, task_name)
          ) > 30
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Celery task running slow"
          description: "Task {{ $labels.task_name }} p95={{ $value | humanizeDuration }}."

  # ---------------------------------------------------------------------------
  # Backup Jobs
  # ---------------------------------------------------------------------------
  - name: alis_backup
    interval: 300s
    rules:
      - alert: BackupJobFailed
        # The backup Beat task fires platform.backup_failed → emits a domain event counter
        # We track this via the domain events published metric.
        expr: |
          increase(alis_domain_events_published_total{event_type="platform.backup_failed"}[25h]) > 0
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "ALIS database backup failed"
          description: "A backup failure event was recorded in the last 25 hours."

      - alert: BackupJobMissed
        # If no backup_completed event in 26 hours, something is wrong.
        expr: |
          increase(alis_domain_events_published_total{event_type="platform.backup_completed"}[26h]) == 0
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "ALIS database backup may have been missed"
          description: "No backup_completed event in the last 26 hours."

  # ---------------------------------------------------------------------------
  # Admissions SLA
  # ---------------------------------------------------------------------------
  - name: alis_admissions
    interval: 120s
    rules:
      - alert: AdmissionsApprovalSLABreached
        # Domain event: admissions.approval_sla_breached published from workflow engine
        expr: |
          increase(alis_domain_events_published_total{event_type="admissions.approval_sla_breached"}[1h]) > 5
        for: 0m
        labels:
          severity: warning
          team: admissions
        annotations:
          summary: "Admissions approvals breaching SLA"
          description: "{{ $value }} SLA breaches in the last hour."

  # ---------------------------------------------------------------------------
  # Finance
  # ---------------------------------------------------------------------------
  - name: alis_finance
    interval: 120s
    rules:
      - alert: PaymentWebhookProcessingFailure
        expr: |
          increase(alis_domain_events_published_total{event_type="finance.webhook_processing_failed"}[15m]) > 3
        for: 0m
        labels:
          severity: critical
          team: finance
        annotations:
          summary: "Payment webhook processing failures"
          description: "{{ $value }} webhook failures in the last 15 minutes."

      - alert: IRNGenerationFailed
        expr: |
          increase(alis_domain_events_published_total{event_type="finance.irn_generation_failed"}[1h]) > 0
        for: 0m
        labels:
          severity: warning
          team: finance
        annotations:
          summary: "NIC e-Invoice IRN generation failed"
          description: "{{ $value }} IRN generation failures in the last hour."

  # ---------------------------------------------------------------------------
  # PhD / Plagiarism
  # ---------------------------------------------------------------------------
  - name: alis_phd
    interval: 300s
    rules:
      - alert: DrillbitPollStalled
        # If we have pending submissions but no results are coming back in 6 hours
        expr: |
          increase(alis_domain_events_published_total{event_type="phd.plagiarism_passed"}[6h]) == 0
          and
          increase(alis_domain_events_published_total{event_type="phd.plagiarism_submitted"}[6h]) > 0
        for: 0m
        labels:
          severity: warning
          team: academics
        annotations:
          summary: "Drillbit plagiarism poll appears stalled"
          description: "Submissions exist but no results received in 6 hours — check Drillbit API."

  # ---------------------------------------------------------------------------
  # Infrastructure
  # ---------------------------------------------------------------------------
  - name: alis_infra
    interval: 60s
    rules:
      - alert: PrometheusScrapeFailing
        expr: up == 0
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Prometheus scrape failing"
          description: "Job {{ $labels.job }} instance {{ $labels.instance }} is down."

      - alert: DiskSpaceRunningLow
        expr: |
          (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) < 0.15
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "Disk space below 15%"
          description: "Available: {{ $value | humanizePercentage }} on {{ $labels.instance }}."
