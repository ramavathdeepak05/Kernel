global:
  resolve_timeout: 5m
  # SMTP configuration — override via environment or secrets in production
  smtp_smarthost: "${ALERT_SMTP_HOST:-localhost:25}"
  smtp_from: "${ALERT_FROM_EMAIL:-alis-alerts@institution.edu.in}"
  smtp_require_tls: false

# ---------------------------------------------------------------------------
# Routing tree
# ---------------------------------------------------------------------------
route:
  group_by: ["alertname", "team"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: default

  routes:
    # Critical alerts → immediate webhook (PagerDuty / OpsGenie stub)
    - matchers:
        - severity="critical"
      receiver: critical_webhook
      group_wait: 10s
      repeat_interval: 1h
      continue: true   # also send to default

    # Finance alerts → finance team email
    - matchers:
        - team="finance"
      receiver: finance_team
      repeat_interval: 2h

    # Admissions alerts → admissions team email
    - matchers:
        - team="admissions"
      receiver: admissions_team
      repeat_interval: 2h

    # Academics alerts → academics team email
    - matchers:
        - team="academics"
      receiver: academics_team
      repeat_interval: 4h

# ---------------------------------------------------------------------------
# Receivers
# ---------------------------------------------------------------------------
receivers:
  - name: default
    email_configs:
      - to: "${ALERT_OPS_EMAIL:-ops@institution.edu.in}"
        send_resolved: true
        html: |
          <h3>{{ .CommonAnnotations.summary }}</h3>
          <p>{{ .CommonAnnotations.description }}</p>
          <p><b>Severity:</b> {{ .CommonLabels.severity }}</p>
          <p><b>Status:</b> {{ .Status }}</p>

  - name: critical_webhook
    webhook_configs:
      - url: "${ALERT_WEBHOOK_URL:-http://localhost:9999/alis-alert}"
        send_resolved: true
        http_config:
          bearer_token: "${ALERT_WEBHOOK_TOKEN:-}"

  - name: finance_team
    email_configs:
      - to: "${ALERT_FINANCE_EMAIL:-finance@institution.edu.in}"
        send_resolved: true

  - name: admissions_team
    email_configs:
      - to: "${ALERT_ADMISSIONS_EMAIL:-admissions@institution.edu.in}"
        send_resolved: true

  - name: academics_team
    email_configs:
      - to: "${ALERT_ACADEMICS_EMAIL:-academics@institution.edu.in}"
        send_resolved: true

# ---------------------------------------------------------------------------
# Inhibition rules
# ---------------------------------------------------------------------------
inhibit_rules:
  # If AppDown is firing, suppress all other alis_app alerts
  - source_matchers:
      - alertname="AppDown"
    target_matchers:
      - job="alis_app"
    equal: ["job"]
