# QUAICU Kernel — example configuration
#
# Copy this file to kernel.toml (or point KERNEL_CONFIG at it) and fill in
# your values. Adapter names must match keys in the adapter registry
# (delivery/sdk/kernel.py:_ADAPTER_REGISTRY).
#
# ── For local development / Docker demo ──────────────────────────────────────
# Use "always_allow" for policy, "memory_ledger" / "memory_events" for a
# fully in-process kernel that needs no external services.
#
# ── For production ───────────────────────────────────────────────────────────
# Replace the dev adapters with real ones (postgres_ledger, kafka_events,
# cel_policy, etc.) as those adapters are built in later phases.

[tenant]
id = "demo-tenant"

# ── Adapter selection (required keys: policy, hitl, ledger, events) ──────────
[adapters]
policy   = "always_allow"    # dev only — replace with "cel_policy" in prod
hitl     = "webhook"
ledger   = "memory_ledger"   # replace with "postgres_ledger" in prod
events   = "memory_events"   # replace with "kafka_events" in prod
identity = "jwt"             # optional — omit to skip JWT verification

# ── CEL policy engine + durable policy store (production) ────────────────────
# Set policy = "cel_policy" above to use the real K·01 CEL evaluator instead of always_allow.
# Choose a durable backend with policy_store; omit it for an in-process (non-persistent) store.
#   "postgres_policy" — durable (run migration 002 first, same alembic.ini as storage)
#   "memory_policy"   — in-process default (lost on restart)
#
# There is NO policy pack / file seeding: policies enter ONLY via the durable write path
# (kernel.register_policy / the management API). A freshly-configured kernel with an empty store
# fail-closed DENYs every governed action until policies are written and ACTIVATED. This is the
# intended secure default. The store is hydrated from the durable backend on startup.
#
# [adapters]
# policy       = "cel_policy"
# policy_store = "postgres_policy"
[policy_store]
dsn = "postgresql://quaicu:change-me@localhost:5432/quaicu"

# ── OpenBao ledger (production) ───────────────────────────────────────────────
# Replace "memory_ledger" with "openbao_ledger" for durable Ed25519 signing.
# The key must exist in OpenBao's Transit engine before starting the kernel:
#   bao secrets enable transit
#   bao write transit/keys/quaicu-ledger type=ed25519
#
# [adapters]
# ledger = "openbao_ledger"
[ledger]
addr      = "http://localhost:8200"
token     = "change-me"         # use an AppRole token in production
key_name  = "quaicu-ledger"     # ed25519 key in OpenBao Transit
# verify_tls = true             # set false only for local dev with self-signed certs

# ── Postgres storage adapter (production) ────────────────────────────────────
# Uncomment and set storage = "postgres_storage" under [adapters] to persist
# actions to Postgres instead of the in-memory default.
# Run migrations first:
#   DATABASE_URL=<dsn> alembic -c adapters/storage/migrations/alembic.ini upgrade head
#
# [adapters]
# storage = "postgres_storage"
[storage]
dsn = "postgresql://quaicu:change-me@localhost:5432/quaicu"

# ── HITL webhook adapter config ───────────────────────────────────────────────
[hitl]
dispatch_url = "http://localhost:9000/hitl/dispatch"
poll_url     = "http://localhost:9000/hitl/status"
timeout      = 30            # seconds before TIMED_OUT (fail-closed)
# api_key    = ""            # optional Bearer token for the HITL service

# ── JWT identity adapter config ───────────────────────────────────────────────
[identity]
secret_or_key = "change-me-in-production"
algorithms    = ["HS256"]
verify        = true         # set false to skip signature check in local dev

# ── OIDC identity adapter (named IdP: Okta / Auth0 / Keycloak) ────────────────
# Set identity = "oidc" under [adapters] to verify IdP-issued JWTs against the provider's
# rotating JWKS instead of a shared HMAC secret. The kernel discovers the JWKS from the issuer's
# /.well-known/openid-configuration (or set jwks_uri explicitly), caches keys, and re-fetches on
# rotation. issuer + audience are mandatory and checked on every token (fail-closed).
#
# [adapters]
# identity = "oidc"
# [identity]
# issuer    = "https://dev-123.okta.com/oauth2/default"   # Auth0 keeps a trailing slash
# audience  = "quaicu-kernel"
# jwks_uri  = ""                # optional — discovered from the issuer when omitted
# algorithms = ["RS256", "ES256"]
# roles_claim = "roles"
# jwks_ttl  = 3600              # seconds a fetched JWKS is trusted before refresh

# ── AI Gateway (governed inference) ───────────────────────────────────────────
# Set inference = "openai_compat" under [adapters] to enable kernel.generate() and the
# POST /v1/inference route. Works with any OpenAI-compatible endpoint (OpenAI, Ollama,
# vLLM, TGI, Together, Mistral). The gateway enforces the model allowlist, masks PII,
# logs every prompt, and tracks the token budget before any model call leaves the kernel.
#
# [adapters]
# inference = "openai_compat"
[inference]
base_url      = "http://localhost:11434/v1"   # e.g. Ollama; use https://api.openai.com/v1 for OpenAI
api_key       = "ollama"
default_model = "llama3"

[gateway]
permitted_models = ["llama3", "gpt-4"]   # only these models may be called for this tenant
max_tokens       = 1000000               # per-tenant token budget (0 = unlimited)
sensitive_fields = ["ssn", "pan", "aadhaar"]   # payload field VALUES masked wherever they appear
mask_patterns    = true                  # also mask PAN/Aadhaar/email/phone/SSN/card in free text

# ── Composable governance profiles ────────────────────────────────────────────
# Each governed action runs under a profile that declares which layers are enforced.
# Presets: "all" (everything), "standard" (no consent), "gateway_only" (gateway protections
# only — no policy/HITL/seal/emit), "audit_only" (seal+emit, no gating).
[governance]
default = "all"
# Control-plane roles permitted to author/manage policies via the /v1/policies API. An actor needs
# at least one of these (resolved from its bearer token). Bare names are normalised to "role:<name>".
# Defaults to ["policy_admin"] when omitted.
# policy_admin_roles = ["policy_admin", "governance_lead"]
# Per-action-type overrides, e.g. run model calls under gateway-only protection:
# [governance.action_profiles]
# "inference.generate" = "gateway_only"

# ── Billing (WS-C — Stripe / Razorpay → tier flips + self-serve checkout) ──────
# Add a [billing] section to enable the payment edge: inbound webhooks flip a tenant's tier and the
# console's Billing page can start a checkout. Omit the whole section to keep billing disabled
# (the /v1/billing/* routes return 503). Configure either or both providers.
#
# Secrets use ${ENV_VAR} and are resolved from the environment at startup — keep live payment keys
# OUT of this file. Provide api_key / key_id+key_secret only if you want outbound checkout (the
# webhook path needs just webhook_secret). The price/plan tables map a provider's price/plan id to a
# kernel tier (STARTER / BUSINESS / ENTERPRISE).
#
# [billing.stripe]
# webhook_secret = "${STRIPE_WEBHOOK_SECRET}"
# api_key        = "${STRIPE_API_KEY}"          # omit for webhook-only
# # api_base       = "https://api.stripe.com"   # override for Stripe-mock / proxies
# # tolerance_seconds = 300
# [billing.stripe.price_to_tier]
# "price_business"   = "BUSINESS"
# "price_enterprise" = "ENTERPRISE"
#
# [billing.razorpay]
# webhook_secret = "${RAZORPAY_WEBHOOK_SECRET}"
# key_id         = "${RAZORPAY_KEY_ID}"         # omit key_id+key_secret for webhook-only
# key_secret     = "${RAZORPAY_KEY_SECRET}"
# # subscription_total_count = 12
# [billing.razorpay.plan_to_tier]
# "plan_business" = "BUSINESS"
