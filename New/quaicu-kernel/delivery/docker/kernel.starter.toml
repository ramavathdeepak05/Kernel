# QUAICU Kernel — STARTER tier (shared SaaS plane, ADR-0009).
# In-memory adapters: zero external dependencies. All STARTER tenants share this kernel; the per-request
# tenant is resolved from the JWT/OIDC claim, not from [tenant] (which only labels the plane).

[tenant]
id = "saas-starter"

[adapters]
policy   = "cel_policy"     # real K·01 CEL enforcement (in-memory store, seeded below)
hitl     = "in_process"     # built-in approvals queue: require_approval actions land in /v1/approvals
ledger   = "memory_ledger"
events   = "memory_events"
identity = "jwt"

# Enforce policy decisions (allow/deny) + seal + emit; consent off (no consent adapter on STARTER).
[governance]
default = "standard"

# Seeded ACTIVATED policies so the free tier demonstrates governance out of the box (a CEL engine with
# an empty store fail-closes to DENY). A `true` allow-baseline keeps normal actions flowing; a deny
# guardrail makes governance visible. Tenants may author up to `max_policies` of their own (see
# TIER_MATRIX). CEL is written against action_type / actor_roles / payload_<field> (see
# docs/CEL_POLICY_GUIDE.md).
[[policy.seed]]
id        = "starter-allow-baseline"
condition = "true"
decision  = "allow"

# Scoped to a demo action type so the payload_amount reference is only evaluated for actions that
# carry it (a CEL reference to an absent variable would otherwise fail-closed-DENY the whole call).
[[policy.seed]]
id        = "starter-high-value-guardrail"
governs   = "demo.payment"
condition = "payload_amount > 1000000"
decision  = "deny"

# The STARTER ledger is in-memory (ephemeral). Record every sealed governed action to the
# `quaicu.audit` logger so the platform's log capture (e.g. Cloud Logging) is the durable audit
# stream — visibility into what each tenant's product is doing without a database. Add
# `pubsub_topic = "projects/<p>/topics/<t>"` to also fan out to Pub/Sub. For AWS, set
# `eventbridge_bus = "<bus-name>"` (needs the [aws] extra + AWS creds). For any HTTP SIEM (Splunk HEC,
# Datadog, …) set `webhook_url = "https://…"` and optionally `[events.webhook_headers]` (e.g. an auth
# token; values may be `${ENV}`). All sinks are best-effort — a sink failure never breaks the seal path.
[events]
log_sink = true
# eventbridge_bus = "quaicu-governance"
# webhook_url     = "https://http-intake.logs.datadoghq.com/api/v2/logs"
# [events.webhook_headers]
# DD-API-KEY = "${DATADOG_API_KEY}"

# In-process HITL queue (see [adapters].hitl). require_approval actions are held here and surfaced on
# /v1/approvals (the console Approvals page); the list/decide surface is tenant-scoped. timeout_seconds
# bounds how long a request waits for a decision. (To route approvals to an external system instead,
# set hitl = "webhook" and provide dispatch_url/poll_url.)
[hitl]
timeout_seconds = 86400

[identity]
secret_or_key = "${KERNEL_JWT_SECRET}"
algorithms    = ["HS256"]
verify        = true
