# QUAICU Kernel — BUSINESS tier (shared SaaS plane, ADR-0009).
# Durable Postgres + the real K·01 CEL policy engine. All BUSINESS tenants share this kernel; storage,
# ledger, and policy rows are tenant-scoped internally. Run migrations (001–005) before first boot.
# An empty policy store fail-closed DENYs every governed action until policies are written + ACTIVATED.

[tenant]
id = "saas-business"

[adapters]
policy       = "cel_policy"        # real K·01 CEL evaluator
policy_store = "postgres_policy"   # durable policy persistence
hitl         = "in_process"        # built-in approvals queue (/v1/approvals); tenant-scoped list/decide
ledger       = "gcp_kms_ledger"    # RFC 6962 transparency log, Cloud KMS-signed STHs (FIPS 140-2)
ledger_store = "postgres_ledger"   # durable Merkle backend (the signer above persists through it)
storage      = "postgres_storage"  # durable action persistence
events       = "memory_events"
identity     = "jwt"

[storage]
dsn = "${KERNEL_DSN}"

[policy_store]
dsn = "${KERNEL_DSN}"

# Cloud KMS asymmetric signing key (EC_SIGN_P256_SHA256) for signed tree heads. These identifiers are
# NOT secrets — the private key never leaves KMS; the Cloud Run service account is granted
# roles/cloudkms.signerVerifier on it. Auth is ADC / Workload Identity (no key files).
[ledger]
project  = "ordinal-quarter-499114-s2"
location = "us-central1"
key_ring = "quaicu-ledger"
key      = "sth-signer"

# Durable Merkle storage for the KMS-signed ledger above (per-tenant tables, F-07).
[ledger_store]
dsn = "${KERNEL_DSN}"

# In-process HITL queue (see [adapters].hitl). require_approval actions surface on /v1/approvals
# (tenant-scoped). `store = "postgres"` persists the queue to quaicu_approvals (migration 013) so it's
# consistent across Cloud Run instances (the in-memory default is per-process). Reuses the kernel DB.
# For an external approval system instead, set hitl = "webhook" + dispatch_url/poll_url.
[hitl]
timeout_seconds = 86400
store = "postgres"
dsn   = "${KERNEL_DSN}"

[identity]
secret_or_key = "${KERNEL_JWT_SECRET}"
algorithms    = ["HS256"]
verify        = true
