# QUAICU Kernel — shared SaaS-plane descriptor (ADR-0009).
#
# Pointed to by KERNEL_CONFIG_SAAS; consumed by delivery/entrypoint_saas.py (CLI: quaicu-kernel-saas).
# One standard kernel config path per served tier. All STARTER tenants share the STARTER kernel and all
# BUSINESS tenants the BUSINESS kernel — the provider routes per request by the tenant's tier (the
# storage/ledger/consent adapters are already tenant-scoped internally, so no kernel-per-tenant).
# ENTERPRISE is intentionally excluded: it ships as a dedicated, license-gated single-kernel deployment
# (delivery/entrypoint.py + TieredKernelProvider.for_enterprise).

[plane]
# ONE durable kernel serves all self-serve tiers (STARTER + BUSINESS). The tier is a feature gate
# enforced at the API edge by the EntitlementEngine (quotas, rate limit, max_policies, premium
# capabilities), not a separate data store — so a STARTER→BUSINESS upgrade is a feature unlock, not a
# data migration. (Replaces the former per-tier `starter = … / business = …` two-kernel shape.)
config = "/etc/quaicu/kernel.shared.toml"

# Control-plane admin guard (ADR-0010). Set the env var QUAICU_ADMIN_TOKEN (Secret Manager) to enable
# the /v1/admin/* routes — list tenants, change a tenant's tier (manual upgrade), read usage. Unset →
# the routes return 503 (closed by default). Present the token as `Authorization: Bearer <token>` or
# `X-Admin-Token`. This is an operator/control-plane credential — never a tenant API key.

# Durable shared plan store so billing-driven tier flips survive a restart (run migration 005 first).
# Omit `dsn` to inherit the per-tier [storage] DSN. Use ${ENV_VAR} to keep credentials out of the file.
[entitlements]
dsn = "${ENTITLEMENTS_DSN}"

# Self-serve signup: POST /v1/signup provisions a STARTER tenant + API key, and protected /v1/* routes
# then require that key. Set QUAICU_API_KEY_PEPPER in the environment. Set `dsn` for durable accounts
# (Postgres, migration 006) so signups survive a restart / scale-out; omit it for in-process accounts.
[account]
enabled = true
dsn = "${ACCOUNT_DSN}"   # durable accounts (Postgres, migration 006) — signups survive restart / scale-out

# ₹2 signup fee (ADR-0011): every signup (incl. free STARTER) pays a ₹2/yr fee via Razorpay before the
# account is created. Keys resolve from RAZORPAY_KEY_ID / RAZORPAY_KEY_SECRET (Secret Manager). Remove
# this section (or set enabled=false) to make signup free again.
[signup_fee]
enabled      = true
amount_paise = 1000000   # ₹10,000 (starter entry fee, per year)
currency     = "INR"
key_id       = "${RAZORPAY_KEY_ID}"
key_secret   = "${RAZORPAY_KEY_SECRET}"

# Discount coupons — applied to the signup fee / consultation deposit BEFORE the Razorpay order is
# created (the kernel reduces the amount; Razorpay just charges it). A code that fully discounts is
# floored at ₹1 (Razorpay's minimum). Add a [[coupon]] block per code.
#   kind = "percent" (value = 0–100, fractional ok) | "flat" (value = paise off)
#   applies_to = "starter" | "consultation" | "all" · valid_until = optional ISO date (inclusive)
[[coupon]]
code        = "INT101"
kind        = "percent"
value       = 99.5
applies_to  = "starter"
valid_until = "2026-09-30"
description = "INT101 — 99.5% off Starter (₹50)"

# Business / Enterprise are quote-based: a prospect pays this consultation deposit to connect with the
# integrations team (the tier is NOT auto-changed). Reuses the Razorpay keys above. The lead + payment
# ref are emailed to notify_email.
[consultation]
amount_paise = 5000000        # ₹50,000
notify_email = "support@quaicu.org"

# Self-serve checkout + webhook tier flips (WS-C). Uncomment + configure to enable the console Billing
# page and the /v1/billing/* routes. Secrets resolve from the environment at load.
# [billing.stripe]
# webhook_secret = "${STRIPE_WEBHOOK_SECRET}"
# api_key        = "${STRIPE_API_KEY}"
# [billing.stripe.price_to_tier]
# "price_business" = "BUSINESS"

# Hosted MCP endpoint (BYO downstream). enabled=true mounts an authenticated Streamable-HTTP endpoint
# at /mcp: a tenant points their MCP client there with a QUAICU API key, and every tool call is
# governed by that tenant's mcp.<tool> policies + sealed to their ledger, then forwarded to the
# tenant's OWN downstream MCP server. Requires the image built with the [mcp] extra.
#   Before it works for a tenant: they register their downstream at PUT /v1/mcp/connection (console →
#   MCP gateway) and activate mcp.<tool> policies (else calls are fail-closed DENY).
# [mcp]
# enabled        = true
# default_policy = "mcp.tool"   # optional: govern all tools under one action type (write one
#                               #   governs="mcp.tool" policy); omit → each tool is mcp.<tool_name>
