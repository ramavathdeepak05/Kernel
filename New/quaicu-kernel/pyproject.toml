[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quaicu-kernel"
version = "0.1.0"
description = "QUAICU Sovereign-tier AI Governance Kernel"
requires-python = ">=3.11"
readme = "README.md"
# Proprietary (PEP 639). LicenseRef-* is the SPDX form for a non-OSI custom license; the full terms are
# in LICENSE, shipped in the distribution via license-files. Counsel fills the bracketed fields (T-4).
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
classifiers = [
    # NB: no "License ::" classifier — PEP 639 forbids it alongside the SPDX `license` expression above.
    "Private :: Do Not Upload",          # proprietary — guard against accidental PyPI publish
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: Financial and Insurance Industry",
    "Topic :: Security",
    "Operating System :: OS Independent",
]

# Runtime dependencies. Single source of truth (previously pinned only in the Docker image).
# Verified against actual imports in core/ adapters/ delivery/ — see the import audit in the
# go-live build log. `requirements.lock` pins these transitively with hashes for reproducible builds.
dependencies = [
    "fastapi>=0.111",            # delivery/api — REST surface
    "uvicorn[standard]>=0.29",   # delivery/entrypoint — ASGI server
    "starlette>=0.37",           # delivery/api middleware (imported directly; ships with fastapi)
    "pydantic>=2.0",             # delivery/api — request/response schemas
    "PyJWT>=2.8",                # adapters/identity — JWT/OIDC token verification
    "cel-python>=0.4.0",         # K·01 — CEL condition evaluation (F-05)
    "cryptography>=42.0",        # K·02 — Ed25519 STH signing
    "opentelemetry-api>=1.21",   # K·04 consent engine — tracing/metrics instrumentation
    "httpx>=0.27",               # OpenBao signer + OIDC/HITL/inference adapters — HTTP client
    "asyncpg>=0.29",             # Postgres adapters — async runtime driver
    "alembic>=1.13",             # schema migrations
    "sqlalchemy>=2.0",           # alembic env.py engine
    "psycopg2-binary>=2.9",      # sync driver for alembic offline/migration mode
]

[project.urls]
Homepage = "https://quaicu.org"
Documentation = "https://kernel.quaicu.org"
Source = "https://github.com/quaicu/kernel"

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "hypothesis>=6.0",           # property-based invariant tests
]
dev = [
    "ruff>=0.4",
    "mypy>=1.8",
    "pip-tools>=7.0",            # pip-compile → requirements.lock
]
# Cloud-native adapters (ADR-0012). Optional so the core stays SDK-free; the adapters import these
# lazily, so they are only required when the corresponding [adapters] key is wired. Not in
# requirements.lock (the base reproducible build) — install with e.g. `pip install .[gcp]`.
gcp = [
    "google-cloud-kms>=3",       # adapters/ledger/gcp_kms — ECDSA-P256 STH signing (FIPS 140-2 L3 HSM)
    "google-genai>=1",           # adapters/inference/vertex — Vertex AI (Gemini) inference
    "google-cloud-dlp>=3",       # adapters/masking/gcp_dlp — managed PII detection (W6-3)
]
aws = [
    # AWS-parity adapters (docs/strategy/ENTERPRISE_CLOUD_STRATEGY.md): KMS Ed25519 signer, Bedrock
    # inference, and the AWS Marketplace BatchMeterUsage sender (adapters/billing/marketplace.py).
    "boto3>=1.34",
]
redis = [
    "redis>=5",                  # adapters/metering/redis_meter — shared cross-replica usage counts
]

[project.scripts]
quaicu-kernel = "delivery.entrypoint:main"
quaicu-kernel-saas = "delivery.entrypoint_saas:main"

[tool.setuptools.packages.find]
include = ["core*", "adapters*", "delivery*"]
exclude = ["tests*", "console*"]

# ── Tooling (moved here from the former repo-root pyproject.toml; this is now the
#    authoritative config, so pytest binds rootdir to New/quaicu-kernel/). ──────────
[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "conformance: spec-derived golden/contract cases",
    "property: Hypothesis property-based invariants",
    "integration: requires real Postgres",
    "chaos: random fault injection",
    "tenant_isolation: adversarial cross-tenant tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
disallow_any_generics = true
