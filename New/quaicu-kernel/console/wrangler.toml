name = "quaicu-console"
main = "worker.js"
compatibility_date = "2024-09-25"

# Workers Static Assets: serve built files from ./dist. The Worker proxies /v1/* to the kernel,
# serves the React SPA from /app/* (with manual fallback to /app/index.html), and serves MkDocs
# static files for everything else (docs live at the root).
[assets]
directory = "./dist"
binding = "ASSETS"
