appId: icu.quaicu.alis-attendance
productName: ALIS Attendance
copyright: Copyright © 2026 QUAICU Pvt. Ltd.

directories:
  output: dist
  buildResources: assets

asar: false

files:
  - dist-electron/**/*
  - dist-renderer/**/*
  - package.json

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: assets/icon.ico
  signingHashAlgorithms: []
  sign: false

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  installerIcon: assets/icon.ico
  uninstallerIcon: assets/icon.ico
  installerHeaderIcon: assets/icon.ico
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: ALIS Attendance

publish:
  provider: generic
  url: https://releases.quaicu.icu/alis-attendance/
