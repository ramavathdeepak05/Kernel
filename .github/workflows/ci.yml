name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install \
            "cel-python>=0.4.0" \
            "pyyaml>=6.0" \
            "cryptography>=42.0" \
            "httpx>=0.27" \
            "asyncpg>=0.29" \
            "alembic>=1.13" \
            "sqlalchemy>=2.0" \
            "psycopg2-binary>=2.9" \
            "fastapi>=0.111" \
            "uvicorn[standard]>=0.29" \
            "pydantic>=2.0" \
            "PyJWT>=2.8" \
            "hypothesis>=6.0" \
            "pytest>=7.0" \
            "pytest-asyncio>=0.21"

      - name: Run test suite
        run: |
          cd New/quaicu-kernel
          python -m pytest --tb=short -q
