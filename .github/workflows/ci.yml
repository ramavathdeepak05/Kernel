name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install (runtime + test + dev extras)
        # Single source of truth: New/quaicu-kernel/pyproject.toml (no hand-maintained dep list).
        run: |
          pip install --upgrade pip
          cd New/quaicu-kernel
          pip install -e ".[test,dev]"

      - name: Lint (ruff)
        run: |
          cd New/quaicu-kernel
          ruff check .

      - name: Run test suite
        # The Postgres + OpenBao integration tests self-skip without live services (10 skips).
        run: |
          cd New/quaicu-kernel
          python -m pytest --tb=short -q
