name: ALIS Architectural Lint

on:
  push:
    branches: [main, develop]
    paths: ['ALIS/server/**/*.py']
  pull_request:
    branches: [main, develop]
    paths: ['ALIS/server/**/*.py']

jobs:
  alis-lint:
    name: Enforce Architectural Invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: "INV-1/2/3 — Run alis-lint"
        run: python -m scripts.alis_lint.runner ALIS/server/ --format json > lint-results.json

      - name: "INV-3 cross-check — Rebuild dependency graph"
        if: always()
        run: |
          pip install code-review-graph
          python -m code_review_graph build
          python scripts/analyze_graph.py

      - name: Upload lint results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: alis-lint-results
          path: lint-results.json
