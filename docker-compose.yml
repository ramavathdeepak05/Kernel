services:

  # ---------------------------------------------------------------------------
  # PostgreSQL 16 + pgvector
  # ---------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: alis_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-alis_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./ALIS/migrations/init:/docker-entrypoint-initdb.d   # runs on first boot
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-alis_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Redis 7 (Celery broker + result backend)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: alis_redis
    restart: unless-stopped
    command: >
      redis-server
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Ollama (local LLM + embeddings)
  # ---------------------------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: alis_ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    # GPU support (uncomment if NVIDIA GPU available)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ---------------------------------------------------------------------------
  # MinIO (S3-compatible local file storage)
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: alis_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # MinIO Console (web UI)
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ---------------------------------------------------------------------------
  # ALIS FastAPI Application
  # ---------------------------------------------------------------------------
  app:
    build:
      context: ./ALIS
      dockerfile: Dockerfile
    container_name: alis_app
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: pgbouncer        # route through PgBouncer, not directly to postgres
      DB_PORT: 5432
      PGBOUNCER_ENABLED: "true"
      REDIS_HOST: redis
      OLLAMA_BASE_URL: http://ollama:11434
      MINIO_ENDPOINT: minio:9000
      VAULT_ADDR: http://vault:8200
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      vault:
        condition: service_healthy
      prometheus:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./ALIS:/app                   # live-reload in dev
    command: >
      uvicorn server.main:app
      --host 0.0.0.0
      --port 8000
      --reload
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Celery Worker
  # ---------------------------------------------------------------------------
  celery_worker:
    build:
      context: ./ALIS
      dockerfile: Dockerfile
    container_name: alis_celery_worker
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: pgbouncer
      DB_PORT: 5432
      PGBOUNCER_ENABLED: "true"
      REDIS_HOST: redis
      OLLAMA_BASE_URL: http://ollama:11434
      MINIO_ENDPOINT: minio:9000
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./ALIS:/app
    command: >
      celery -A server.worker worker
      --loglevel=info
      --concurrency=4
      --queues=default,ai_tasks,notifications

  # ---------------------------------------------------------------------------
  # Celery Beat (periodic tasks — academic calendar, fee checks, reminders)
  # ---------------------------------------------------------------------------
  celery_beat:
    build:
      context: ./ALIS
      dockerfile: Dockerfile
    container_name: alis_celery_beat
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: pgbouncer
      DB_PORT: "5432"
      REDIS_HOST: redis
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./ALIS:/app
    command: >
      celery -A server.worker beat
      --loglevel=info
      --schedule=/tmp/celerybeat-schedule

  # ---------------------------------------------------------------------------
  # PgBouncer (connection pooler — session mode, max 1000 clients → 80 backend)
  # ---------------------------------------------------------------------------
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: alis_pgbouncer
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-alis_db}
      POOL_MODE: session
      MAX_CLIENT_CONN: 1000
      DEFAULT_POOL_SIZE: 80
      SERVER_IDLE_TIMEOUT: 30    # free idle backend after 30s
      CLIENT_IDLE_TIMEOUT: 600   # close idle client after 10m
      SERVER_RESET_QUERY: DISCARD ALL
    ports:
      - "6432:5432"              # 6432 externally, 5432 inside alis_network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p 5432 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - default

  # ---------------------------------------------------------------------------
  # HashiCorp Vault (P0-2: exam paper encryption + CoE-only decrypt + audit)
  # Production mode — Raft integrated storage (durable, survives restarts).
  #
  # First-time setup:
  #   docker exec alis_vault vault operator init -key-shares=5 -key-threshold=3
  #   Save the unseal keys and root token, then set in .env:
  #     VAULT_TOKEN=<root_token>
  #     VAULT_UNSEAL_KEY_1..3=<unseal_keys>
  #   Then unseal:
  #     docker exec alis_vault vault operator unseal $VAULT_UNSEAL_KEY_1
  #     docker exec alis_vault vault operator unseal $VAULT_UNSEAL_KEY_2
  #     docker exec alis_vault vault operator unseal $VAULT_UNSEAL_KEY_3
  # ---------------------------------------------------------------------------
  vault:
    image: hashicorp/vault:1.17
    container_name: alis_vault
    restart: unless-stopped
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_ADDR: http://127.0.0.1:8200
      VAULT_TOKEN: ${VAULT_TOKEN}
      VAULT_UNSEAL_KEY_1: ${VAULT_UNSEAL_KEY_1:-}
      VAULT_UNSEAL_KEY_2: ${VAULT_UNSEAL_KEY_2:-}
      VAULT_UNSEAL_KEY_3: ${VAULT_UNSEAL_KEY_3:-}
    ports:
      - "8200:8200"
    volumes:
      - vault_data:/vault/data
      - vault_logs:/vault/logs
      - ./infra/vault:/vault/config:ro
    entrypoint: ["sh", "/vault/config/vault-autostart.sh"]
    healthcheck:
      test: ["CMD-SHELL", "vault status -address=http://localhost:8200 | grep -E 'Sealed.*false|Active' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Prometheus (metrics scraping)
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.54.0
    container_name: alis_prometheus
    restart: unless-stopped
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/monitoring/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ---------------------------------------------------------------------------
  # Grafana (dashboards)
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:11.2.0
    container_name: alis_grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-alis-grafana-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_INSTALL_PLUGINS: grafana-piechart-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki

  # ---------------------------------------------------------------------------
  # Loki (log aggregation)
  # ---------------------------------------------------------------------------
  loki:
    image: grafana/loki:3.1.0
    container_name: alis_loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./infra/monitoring/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml

  # ---------------------------------------------------------------------------
  # Promtail (log shipper — reads Docker container logs)
  # ---------------------------------------------------------------------------
  promtail:
    image: grafana/promtail:3.1.0
    container_name: alis_promtail
    restart: unless-stopped
    volumes:
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./infra/monitoring/promtail-config.yml:/etc/promtail/config.yml:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki

  # ---------------------------------------------------------------------------
  # Alertmanager (routes Prometheus alerts → email / webhook)
  # ---------------------------------------------------------------------------
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: alis_alertmanager
    restart: unless-stopped
    volumes:
      - ./infra/monitoring/alertmanager.yml:/etc/alertmanager/config.yml:ro
      - alertmanager_data:/alertmanager
    ports:
      - "9093:9093"
    command:
      - --config.file=/etc/alertmanager/config.yml
      - --storage.path=/alertmanager
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9093/-/healthy || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ---------------------------------------------------------------------------
  # Nginx (reverse proxy + SSL termination)
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: alis_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro    # SSL certificates
    depends_on:
      - app
    healthcheck:
      test: ["CMD-SHELL", "nginx -t || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  redis_data:
  ollama_data:
  minio_data:
  vault_data:
  vault_logs:
  prometheus_data:
  grafana_data:
  loki_data:
  alertmanager_data:

networks:
  default:
    name: alis_network
