worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile        on;
    keepalive_timeout 65;
    client_max_body_size 50M;   # document uploads

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=api:10m  rate=60r/m;
    limit_req_zone $binary_remote_addr zone=ai:10m   rate=10r/m;

    upstream alis_app {
        server app:8000;
        keepalive 32;
    }

    # -------------------------------------------------------------------------
    # HTTP → redirect to HTTPS in production
    # -------------------------------------------------------------------------
    server {
        listen 80;
        server_name _;

        # Health check (no redirect — needed for Docker healthcheck)
        location /health {
            proxy_pass http://alis_app;
        }

        # All other traffic → HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

