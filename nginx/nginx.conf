##############################################################################
# ALIS Nginx Configuration
# Reverse proxy + rate limiting + security headers + SSL-ready
##############################################################################

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ---------------------------------------------------------------------------
    # Logging — structured JSON
    # ---------------------------------------------------------------------------
    log_format json_combined escape=json
        '{'
            '"time":"$time_iso8601",'
            '"remote_addr":"$remote_addr",'
            '"method":"$request_method",'
            '"uri":"$request_uri",'
            '"status":$status,'
            '"body_bytes":$body_bytes_sent,'
            '"request_time":$request_time,'
            '"upstream_response_time":"$upstream_response_time",'
            '"http_referrer":"$http_referer",'
            '"http_user_agent":"$http_user_agent",'
            '"http_x_forwarded_for":"$http_x_forwarded_for",'
            '"request_id":"$request_id"'
        '}';

    access_log  /var/log/nginx/access.log  json_combined;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    server_tokens  off;

    # Compression
    gzip  on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/xml+rss
        application/atom+xml image/svg+xml;

    # ---------------------------------------------------------------------------
    # Rate limiting zones
    # ---------------------------------------------------------------------------
    # General API: 60 req/min per IP
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/m;
    # Auth endpoints: 10 req/min per IP (stricter)
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;
    # Webhook endpoints: 300 req/min (payment gateways need higher throughput)
    limit_req_zone $binary_remote_addr zone=webhook_limit:10m rate=300r/m;

    limit_req_status 429;

    # ---------------------------------------------------------------------------
    # Upstream: ALIS FastAPI application
    # ---------------------------------------------------------------------------
    upstream alis_app {
        server app:8000;
        keepalive 32;
    }

    # ---------------------------------------------------------------------------
    # HTTP → HTTPS redirect (production)
    # ---------------------------------------------------------------------------
    server {
        listen 80;
        server_name _;

        # Allow Let's Encrypt ACME challenges
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ---------------------------------------------------------------------------
    # HTTPS main server
    # ---------------------------------------------------------------------------
    server {
        listen 443 ssl http2;
        server_name ${ALIS_DOMAIN:-localhost};

        # SSL certificates (provide via volume mount or Let's Encrypt)
        ssl_certificate      /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key  /etc/nginx/certs/privkey.pem;
        ssl_session_cache    shared:SSL:10m;
        ssl_session_timeout  1d;
        ssl_protocols        TLSv1.2 TLSv1.3;
        ssl_ciphers          ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;

        # HSTS (2 years — only enable once SSL is confirmed working)
        # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

        # ---------------------------------------------------------------------------
        # Security headers
        # ---------------------------------------------------------------------------
        add_header X-Content-Type-Options   "nosniff" always;
        add_header X-Frame-Options          "DENY" always;
        add_header X-XSS-Protection         "1; mode=block" always;
        add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy       "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' wss:; frame-ancestors 'none';" always;

        # Request ID forwarding
        add_header X-Request-ID $request_id always;

        # Max upload size (document uploads, thesis PDFs, etc.)
        client_max_body_size 50M;

        # ---------------------------------------------------------------------------
        # Block internal-only endpoints from public access
        # ---------------------------------------------------------------------------
        location = /metrics {
            deny all;
        }
        location = /health {
            proxy_pass http://alis_app;
            proxy_set_header Host $host;
            access_log off;
        }
        location = /ready {
            proxy_pass http://alis_app;
            proxy_set_header Host $host;
            access_log off;
        }

        # ---------------------------------------------------------------------------
        # Auth endpoints — strict rate limiting
        # ---------------------------------------------------------------------------
        location /api/v1/auth/ {
            limit_req zone=auth_limit burst=5 nodelay;
            proxy_pass http://alis_app;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID      $request_id;
        }

        # ---------------------------------------------------------------------------
        # Webhook endpoints — higher limit (payment gateway callbacks)
        # ---------------------------------------------------------------------------
        location ~ ^/api/v1/(intake|finance)/.*webhook {
            limit_req zone=webhook_limit burst=50 nodelay;
            proxy_pass http://alis_app;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID      $request_id;
            proxy_read_timeout 30s;
        }

        # ---------------------------------------------------------------------------
        # API — standard rate limiting
        # ---------------------------------------------------------------------------
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://alis_app;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID      $request_id;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        # ---------------------------------------------------------------------------
        # Static frontend (React SPA)
        # ---------------------------------------------------------------------------
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;

            # Cache static assets aggressively, HTML never
            location ~* \.(js|css|woff2?|ttf|otf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
                access_log off;
            }
            location = /index.html {
                expires -1;
                add_header Cache-Control "no-store, no-cache, must-revalidate";
            }
        }
    }
}
