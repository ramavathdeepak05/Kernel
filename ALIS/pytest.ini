[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Async mode — use asyncio for all async tests
asyncio_mode = auto

# Custom markers
markers =
    unit: Pure unit tests — no external dependencies (fast, always run)
    integration: Require real Postgres + Redis (skip in CI without services)
    ai: Require Ollama running locally (skip in CI without GPU/model)
    slow: Tests that take > 5s

# Show extra test summary for failures and warnings
addopts = -v --tb=short -q

# Suppress noisy deprecation warnings from third-party libs
filterwarnings =
    ignore::DeprecationWarning:passlib
    ignore::DeprecationWarning:jose
    ignore::PendingDeprecationWarning
