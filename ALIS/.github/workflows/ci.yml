name: ALIS CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ---------------------------------------------------------------------------
  # Backend: lint → typecheck → unit tests → build image
  # ---------------------------------------------------------------------------
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: alis_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: development
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: alis_test
      DB_USER: postgres
      DB_PASSWORD: postgres
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      JWT_SECRET_KEY: ci-test-secret-key-32-char-minimum
      APP_SECRET_KEY: ci-test-app-secret-key-32-char-min
      MINIO_ENDPOINT: localhost:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ALIS/requirements.txt

      - name: Install dependencies
        working-directory: ALIS
        run: pip install -r requirements.txt

      - name: Run Alembic migrations (test DB)
        working-directory: ALIS
        run: alembic upgrade head

      - name: Run unit tests (no external services required)
        working-directory: ALIS
        run: pytest tests/ -m "not integration and not ai" --tb=short -q

      - name: Run integration tests (Postgres + Redis available)
        working-directory: ALIS
        run: pytest tests/ -m integration --tb=short -q

      - name: Build Docker image
        working-directory: ALIS
        run: docker build -t alis-backend:ci .

  # ---------------------------------------------------------------------------
  # Frontend: typecheck → lint → build
  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend (React + TypeScript)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: TypeScript typecheck
        working-directory: web
        run: npx tsc --noEmit

      - name: Lint
        working-directory: web
        run: npm run lint

      - name: Build
        working-directory: web
        run: npm run build
        env:
          VITE_API_URL: http://localhost:8000
